<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="sideGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0099cc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#66e0ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="16" cy="16" r="15" fill="#1a1a1a" stroke="#333" stroke-width="1" />

    <!-- Isometric cube representing 3D -->
    <!-- Front face -->
    <path d="M8 12 L16 8 L24 12 L16 16 Z" fill="url(#topGradient)" opacity="0.9" />

    <!-- Left face -->
    <path d="M8 12 L16 16 L16 24 L8 20 Z" fill="url(#cubeGradient)" opacity="0.8" />

    <!-- Right face -->
    <path d="M16 16 L24 12 L24 20 L16 24 Z" fill="url(#sideGradient)" opacity="0.7" />

    <!-- Wireframe edges for 3D effect -->
    <path d="M8 12 L16 8 L24 12 M16 8 L16 16 M8 12 L8 20 L16 24 M24 12 L24 20 L16 24"
        stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.6" />

    <!-- Small accent dots for tech feel -->
    <circle cx="6" cy="8" r="1" fill="#00d4ff" opacity="0.6" />
    <circle cx="26" cy="8" r="1" fill="#00d4ff" opacity="0.6" />
    <circle cx="6" cy="24" r="1" fill="#00d4ff" opacity="0.6" />
</svg>